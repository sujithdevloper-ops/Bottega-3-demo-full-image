<!-- Minimal Architectural Inverted U Archway Intro Preloader (Home Page Only) -->
<div id="bottega-intro-loader" class="bottega-intro-loader">
    <!-- Outer Screen Architectural Frame Border Lines (100% Perfect Position on All Devices) -->
    <div class="intro-loader-screen-border">
        <div class="border-line-outer"></div>
        <div class="border-line-inner"></div>
    </div>

    <!-- Low Opacity Cursive Watermark -->
    <div class="intro-loader-watermark">Bottega</div>

    <!-- Logo & Progress Bar Content -->
    <div class="intro-loader-content">
        <img src="assets/images/bottega_black_logo.png" alt="Bottega Studio" class="intro-loader-logo">
        <div class="intro-loader-bar">
            <div class="intro-loader-progress"></div>
        </div>
    </div>

    <!-- Architectural Inverted U Archway Reveal SVG -->
    <svg class="arch-reveal-svg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMax slice">
        <defs>
            <mask id="arch-cutout-mask">
                <!-- Solid white canvas -->
                <rect x="-500" y="-500" width="2000" height="2000" fill="#ffffff" />
                <!-- Black shape cutting hole in white background -->
                <g id="arch-hole" class="arch-anim-target">
                    <path d="M 200,1000 L 200,450 A 300,300 0 0,1 800,450 L 800,1000 Z" fill="#000000" />
                </g>
            </mask>
        </defs>

        <!-- Solid White Background Overlay Masked by Arch Hole -->
        <rect x="-500" y="-500" width="2000" height="2000" fill="#ffffff" mask="url(#arch-cutout-mask)" />

        <!-- Concentric Architectural Border Lines Overlay -->
        <g id="arch-lines-group" class="arch-anim-target">
            <path class="arch-gold-primary" d="M 200,1000 L 200,450 A 300,300 0 0,1 800,450 L 800,1000" stroke="#000000" stroke-width="2.5" fill="none" />
            <path class="arch-gold-secondary" d="M 182,1000 L 182,450 A 318,318 0 0,1 818,450 L 818,1000" stroke="rgba(0, 0, 0, 0.35)" stroke-width="1.5" fill="none" />
            <path class="arch-gold-tertiary" d="M 168,1000 L 168,450 A 332,332 0 0,1 832,450 L 832,1000" stroke="rgba(0, 0, 0, 0.18)" stroke-width="1" fill="none" />
        </g>
    </svg>
</div>
