<script>
// Sticky Logo Only on Scroll Engine
document.addEventListener('DOMContentLoaded', () => {
    const brandLogo = document.getElementById('site-brand-logo');
    window.addEventListener('scroll', () => {
        if (window.scrollY > 100) {
            brandLogo.classList.add('is-sticky-logo');
        } else {
            brandLogo.classList.remove('is-sticky-logo');
        }
    });
});

// Scroll Reveal Observer
document.addEventListener('DOMContentLoaded', () => {
    const revealObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('is-visible');
            }
        });
    }, { threshold: 0.18 });

    document.querySelectorAll('.reveal-on-scroll, .reveal-curtain-wrap').forEach(el => {
        revealObserver.observe(el);
    });
});

// Auto-Moving Hero Slider Engine (8s per slide, Project name appears at 6s)
const heroSlides = [
    {
        img: "https://images.unsplash.com/photo-1613977257363-707ba9348227?auto=format&fit=crop&w=2000&q=85",
        projectName: "Tropical Sanctuary Villa · Calicut, Kerala"
    },
    {
        img: "https://images.unsplash.com/photo-1580587771525-78b9dba3b914?auto=format&fit=crop&w=2000&q=85",
        projectName: "Courtyard Green Estate · Wayanad, Kerala"
    },
    {
        img: "https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&w=2000&q=85",
        projectName: "Tropics Eco Resort · Coorg, Karnataka"
    },
    {
        img: "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=2000&q=85",
        projectName: "Villa Calicut · Calicut, Kerala"
    },
    {
        img: "https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?auto=format&fit=crop&w=2000&q=85",
        projectName: "Residence at Kochi · Kochi, Kerala"
    },
    {
        img: "https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?auto=format&fit=crop&w=2000&q=85",
        projectName: "Hillside Estate · Wayanad, Kerala"
    }
];

let currentHeroSlideIdx = 0;
let heroAutoSlideInterval = null;
let heroCaptionTimer = null;

function setHeroSlide(idx) {
    currentHeroSlideIdx = (idx + heroSlides.length) % heroSlides.length;
    const slide = heroSlides[currentHeroSlideIdx];

    const heroBg = document.getElementById('hero-bg');
    const projectTitleEl = document.getElementById('hero-project-title');

    // 1. Immediately hide previous project title when slide transitions
    if (projectTitleEl) {
        projectTitleEl.classList.remove('is-visible');
    }
    if (heroCaptionTimer) clearTimeout(heroCaptionTimer);

    // 2. Crossfade background image
    if (heroBg) {
        heroBg.style.opacity = '0.35';
        setTimeout(() => {
            heroBg.style.backgroundImage = `url('${slide.img}')`;
            heroBg.style.opacity = '1';
        }, 220);
    }

    // 3. At 6th second (6000ms), reveal project name in bottom left
    heroCaptionTimer = setTimeout(() => {
        if (projectTitleEl && slide.projectName) {
            projectTitleEl.textContent = slide.projectName;
            projectTitleEl.classList.add('is-visible');
        }
    }, 6000);
}

function navigateHeroSlide(direction) {
    resetHeroAutoSlide();
    setHeroSlide(currentHeroSlideIdx + direction);
}

function startHeroAutoSlide() {
    if (heroAutoSlideInterval) clearInterval(heroAutoSlideInterval);
    heroAutoSlideInterval = setInterval(() => {
        setHeroSlide(currentHeroSlideIdx + 1);
    }, 8000);
}

function resetHeroAutoSlide() {
    startHeroAutoSlide();
}

// Initial Kickoff for Hero Slider
document.addEventListener('DOMContentLoaded', () => {
    setHeroSlide(0);
    startHeroAutoSlide();
});


// 3D Book Page Flip Engine

        year: "CHAPTER 01 · 1995",

let currentBookPageIdx = 0;
let isBookFlipping = false;

function setBookPage(pageIdx, direction = 1) {
    if (isBookFlipping) return;

    const prevIdx = currentBookPageIdx;
    const nextIdx = (pageIdx + bookPages.length) % bookPages.length;
    if (nextIdx === prevIdx) return;

    isBookFlipping = true;
    currentBookPageIdx = nextIdx;

    const prevData = bookPages[prevIdx];
    const nextData = bookPages[nextIdx];

    const leftImg = document.getElementById('book-left-img');
    const pageCounter = document.getElementById('book-current-page');
    const leaf = document.getElementById('book-turning-leaf');
    const leafFrontContent = document.getElementById('leaf-front-content');
    const leafBackImg = document.getElementById('leaf-back-img');

    if (pageCounter) {
        pageCounter.textContent = `FOLIO ${String(nextIdx + 1).padStart(2, '0')}`;
    }

    // 1. Print Previous Chapter Text onto turning leaf front (lifting off right side)
    if (leafFrontContent) {
        leafFrontContent.innerHTML = `
            <span class="book-year-badge">${prevData.year}</span>
            <h3 class="book-chapter-title">${prevData.title}</h3>
            <h4 class="book-chapter-subtitle">${prevData.subtitle}</h4>
            <p class="book-chapter-desc">${prevData.desc}</p>
            <div class="book-pills-row">
                ${(prevData.pills || []).map(p => `<span class="book-pill">${p}</span>`).join('')}
            </div>
        `;
    }

    // 2. Put Next Chapter Image onto turning leaf back (flipping onto left side)
    if (leafBackImg) {
        leafBackImg.src = nextData.img;
    }

    // 3. Immediately reveal Next Chapter Text on static Right Page underneath lifting sheet
    document.getElementById('book-page-year').textContent = nextData.year;
    document.getElementById('book-page-title').textContent = nextData.title;
    document.getElementById('book-page-subtitle').textContent = nextData.subtitle;
    document.getElementById('book-page-desc').textContent = nextData.desc;
    const pillsRow = document.getElementById('book-page-pills');
    if (pillsRow && nextData.pills) {
        pillsRow.innerHTML = nextData.pills.map(p => `<span class="book-pill">${p}</span>`).join('');
    }

    // 4. Start smooth, slow 3D page flip (0.9s)
    if (leaf) {
        leaf.style.transition = 'transform 0.9s cubic-bezier(0.645, 0.045, 0.355, 1.000)';
        leaf.className = `book-turning-leaf ${direction > 0 ? 'turn-next' : 'turn-prev'}`;
    }

    // 5. As turning sheet completes landing on left side (860ms), update static Left Page photo underneath
    setTimeout(() => {
        if (leftImg) leftImg.src = nextData.img;
    }, 860);

    // 6. Reset turning leaf silently at 920ms without any pop
    setTimeout(() => {
        if (leaf) {
            leaf.style.transition = 'none';
            leaf.className = 'book-turning-leaf';
            void leaf.offsetWidth; // Force reflow
        }
        isBookFlipping = false;
    }, 920);
}

function nextBookPage() {
    setBookPage(currentBookPageIdx + 1, 1);
}

function prevBookPage() {
    setBookPage(currentBookPageIdx - 1, -1);
}

// Camera Reload Engine with Strict Inertia Lock
let activeFilmIdx = 0;
let isScrollLocked = false;

function rollFilmToProject(targetIdx) {
    if (targetIdx === activeFilmIdx) return;

    activeFilmIdx = (targetIdx + 6) % 6;
    const cards = document.querySelectorAll('.film-frame-card');
    const items = document.querySelectorAll('.project-selector-item');
    const shutter = document.getElementById('camera-reload-shutter');

    if (shutter) {
        shutter.classList.add('wipe');
        setTimeout(() => shutter.classList.remove('wipe'), 280);
    }

    cards.forEach((card, idx) => {
        if (idx === activeFilmIdx) {
            card.classList.add('active');
            card.style.transform = 'translateY(0) scale(1)';
            card.style.opacity = '1';
        } else if (idx < activeFilmIdx) {
            card.classList.remove('active');
            card.style.transform = 'translateY(-100%) scale(0.95)';
            card.style.opacity = '0';
        } else {
            card.classList.remove('active');
            card.style.transform = 'translateY(100%) scale(0.95)';
            card.style.opacity = '0';
        }
    });

    items.forEach((item, i) => {
        if (i === activeFilmIdx) item.classList.add('active');
        else item.classList.remove('active');
    });
}

function handleFilmRollScroll(e) {
    e.preventDefault();
    if (Math.abs(e.deltaY) < 16 || isScrollLocked) return;

    isScrollLocked = true;

    if (e.deltaY > 0) {
        rollFilmToProject(activeFilmIdx + 1);
    } else {
        rollFilmToProject(activeFilmIdx - 1);
    }

    setTimeout(() => {
        isScrollLocked = false;
    }, 850);
}

document.addEventListener('DOMContentLoaded', function () {
    const serviceItems = document.querySelectorAll('.service-item');
    const previewImg = document.getElementById('service-preview-img');
    const previewTitle = document.getElementById('service-preview-title');
    const previewDesc = document.getElementById('service-preview-desc');

    serviceItems.forEach(item => {
        item.addEventListener('click', function () {
            serviceItems.forEach(i => i.classList.remove('active'));
            this.classList.add('active');

            const newImg = this.getAttribute('data-img');
            const newTitle = this.getAttribute('data-title');
            const newDesc = this.getAttribute('data-desc');

            if (previewImg && newImg) {
                previewImg.style.opacity = '0.3';
                setTimeout(() => {
                    previewImg.src = newImg;
                    if (previewTitle) previewTitle.textContent = newTitle;
                    if (previewDesc) previewDesc.textContent = newDesc;
                    previewImg.style.opacity = '1';
                }, 200);
            }
        });
    });
